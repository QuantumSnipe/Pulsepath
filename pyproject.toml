[project]
name = "pulsepath"
version = "0.4.0"
description = "A local-first visual network activity explorer for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: JavaScript",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
geoip = ["maxminddb==3.1.1"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
exclude = ["vendor", ".venv", "**/__pycache__"]
extraPaths = ["vendor"]
