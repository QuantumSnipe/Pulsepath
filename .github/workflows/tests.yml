name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: python3 -m py_compile pulsepath.py install_geoip.py
      - name: Parse browser JavaScript
        run: node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); new Function(h.split('<script>')[1].split('</script>')[0]);"
